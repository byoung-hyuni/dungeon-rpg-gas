<script>
/**
 * Api — 서버(Code.gs) 호출을 Promise로 감싼다.
 * Apps Script 웹 앱에서는 google.script.run 을 쓰고,
 * 로컬 미리보기(preview.html)에서는 같은 이름의 전역 함수(모의 서버)를 부른다.
 */
const Api = (function () {
  const hasGAS = typeof google !== 'undefined' && google.script && google.script.run;
  function call(fn) {
    const args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      if (hasGAS) {
        const runner = google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(function (e) { reject(e && e.message ? e : new Error(String(e))); });
        runner[fn].apply(runner, args);
      } else {
        setTimeout(function () {
          try { resolve(window[fn].apply(null, JSON.parse(JSON.stringify(args)))); } catch (e) { reject(e); }
        }, 120);
      }
    });
  }
  const parse = function (s) { return typeof s === 'string' ? JSON.parse(s) : s; };
  return {
    offline: !hasGAS,
    getGameData: function () { return call('getGameData').then(parse); },
    login: function (name, pin) { return call('login', name, pin); },
    save: function (name, pin, data, expectNew) { return call('savePlayer', name, pin, data, expectNew); },
    submitRecord: function (name, pin, rec) { return call('submitRecord', name, pin, rec); },
    getRankings: function () { return call('getRankings').then(parse); },
  };
})();
</script>
