<style>
  :root {
    --u: 1px;               /* 게임 화면 폭 960 기준 1px (JS가 창 크기에 맞춰 갱신) */
    --bg: #0d0b12;
    --panel: rgba(20, 17, 30, 0.92);
    --panel2: rgba(38, 32, 56, 0.95);
    --line: #4b3f6b;
    --gold: #ffcc4d;
    --text: #efeaf7;
    --muted: #a59dbb;
    --hp: #e5484d;
    --mp: #3e7bfa;
    --ok: #3fbf7f;
    --g-일반: #dddddd; --g-매직: #68d5ed; --g-레어: #b36bff; --g-유니크: #ff5ec7; --g-에픽: #ffb400;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  body {
    color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  #app {
    position: relative; width: 960px; height: 540px; outline: none;
    box-shadow: 0 0 40px rgba(120, 80, 200, .25); overflow: hidden; background: #000;
    font-size: calc(var(--u) * 15);
  }
  #game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; image-rendering: auto; }
  #ui { position: absolute; inset: 0; pointer-events: none; }
  #ui > * { pointer-events: auto; }
  .hidden { display: none !important; }

  /* 공통 패널 */
  .panel { background: var(--panel); border: calc(var(--u)*2) solid var(--line); border-radius: calc(var(--u)*10); box-shadow: 0 calc(var(--u)*6) calc(var(--u)*24) rgba(0,0,0,.5); }
  .title { font-weight: 800; letter-spacing: .02em; }
  .muted { color: var(--muted); }
  .gold { color: var(--gold); }
  .key { display: inline-block; min-width: 1.6em; padding: 0 .35em; border: 1px solid #8d7fb5; border-bottom-width: 3px; border-radius: .3em; font-size: .85em; text-align: center; background: #241e36; color: #fff; font-family: ui-monospace, Menlo, Consolas, monospace; }
  .g-일반 { color: var(--g-일반); } .g-매직 { color: var(--g-매직); } .g-레어 { color: var(--g-레어); } .g-유니크 { color: var(--g-유니크); } .g-에픽 { color: var(--g-에픽); }

  /* 화면 배치 */
  .screen { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .screen.left { justify-content: flex-start; padding-left: calc(var(--u)*28); }
  .col { display: flex; flex-direction: column; gap: calc(var(--u)*10); }
  .row { display: flex; gap: calc(var(--u)*12); }

  /* 로그인 */
  .login { width: calc(var(--u)*420); padding: calc(var(--u)*28); text-align: center; }
  .login h1 { margin: 0 0 calc(var(--u)*4); font-size: calc(var(--u)*38); color: var(--gold); text-shadow: 0 calc(var(--u)*3) 0 #6b3b00; }
  .login input {
    width: 100%; font: inherit; font-size: calc(var(--u)*18); padding: calc(var(--u)*10) calc(var(--u)*12);
    background: #120f1b; color: #fff; border: calc(var(--u)*2) solid var(--line); border-radius: calc(var(--u)*8); outline: none;
  }
  .login input:focus { border-color: var(--gold); }
  .login .pin { letter-spacing: .6em; text-align: center; }
  .err { color: #ff7b7b; min-height: 1.3em; font-size: .9em; }
  .btn {
    font: inherit; font-weight: 700; padding: calc(var(--u)*10); border-radius: calc(var(--u)*8); border: 0; cursor: pointer;
    background: linear-gradient(#ffd966, #e0a100); color: #2b1a00;
  }

  /* 메뉴 */
  .menu { list-style: none; margin: 0; padding: calc(var(--u)*8); }
  .menu li {
    padding: calc(var(--u)*9) calc(var(--u)*14); border-radius: calc(var(--u)*6); cursor: pointer; display: flex; justify-content: space-between; gap: calc(var(--u)*12); align-items: center;
    border: calc(var(--u)*1) solid transparent;
  }
  .menu li.sel { background: linear-gradient(90deg, rgba(255,204,77,.22), rgba(255,204,77,.04)); border-color: rgba(255,204,77,.6); }
  .menu li.sel::before { content: '▶'; color: var(--gold); margin-right: calc(var(--u)*-4); font-size: .8em; }
  .menu li.dis { opacity: .45; }
  .menu li .sub { color: var(--muted); font-size: .85em; }
  .menu li .grow { flex: 1; }

  /* 마을 */
  .town-menu { width: calc(var(--u)*300); padding: calc(var(--u)*6) 0; }
  .town-menu h2, .box h2 { margin: calc(var(--u)*6) calc(var(--u)*18) 0; font-size: calc(var(--u)*20); color: var(--gold); }
  .charcard { width: calc(var(--u)*300); padding: calc(var(--u)*16); position: absolute; right: calc(var(--u)*28); top: calc(var(--u)*28); }
  .charcard .face { font-size: calc(var(--u)*46); line-height: 1; }
  .stat { display: grid; grid-template-columns: 1fr 1fr; gap: calc(var(--u)*4) calc(var(--u)*14); font-size: .92em; margin-top: calc(var(--u)*8); }
  .stat b { float: right; }
  .bar { height: calc(var(--u)*8); background: #221c33; border-radius: 99px; overflow: hidden; margin: calc(var(--u)*4) 0; }
  .bar > i { display: block; height: 100%; background: linear-gradient(90deg, #7ee787, #3fbf7f); }
  .savebadge { font-size: .8em; padding: calc(var(--u)*2) calc(var(--u)*8); border-radius: 99px; }
  .savebadge.dirty { background: #5a2323; color: #ffb3b3; }
  .savebadge.clean { background: #1f4a33; color: #9ff0c3; }
  .hintbar { position: absolute; left: 0; right: 0; bottom: 0; padding: calc(var(--u)*6) calc(var(--u)*16); background: rgba(0,0,0,.6); font-size: .82em; color: var(--muted); display: flex; gap: calc(var(--u)*16); flex-wrap: wrap; }

  /* 큰 박스 화면 (상점/인벤토리/랭킹 등) */
  .box { width: calc(var(--u)*880); height: calc(var(--u)*470); padding: calc(var(--u)*10) calc(var(--u)*6); display: flex; flex-direction: column; }
  .box .head { display: flex; justify-content: space-between; align-items: center; padding-right: calc(var(--u)*18); }
  .tabs { display: flex; gap: calc(var(--u)*6); padding: calc(var(--u)*8) calc(var(--u)*18) 0; }
  .tabs span { padding: calc(var(--u)*5) calc(var(--u)*14); border-radius: calc(var(--u)*6) calc(var(--u)*6) 0 0; background: #221c33; color: var(--muted); cursor: pointer; }
  .tabs span.on { background: var(--panel2); color: var(--gold); font-weight: 700; }
  .split { display: flex; gap: calc(var(--u)*10); flex: 1; min-height: 0; padding: 0 calc(var(--u)*10); }
  .list { flex: 1.3; overflow-y: auto; background: var(--panel2); border-radius: calc(var(--u)*8); }
  .detail { flex: 1; background: var(--panel2); border-radius: calc(var(--u)*8); padding: calc(var(--u)*14); overflow-y: auto; }
  .detail .big { font-size: calc(var(--u)*40); }
  .up { color: #7ee787; } .down { color: #ff7b7b; }
  .slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: calc(var(--u)*6); margin-bottom: calc(var(--u)*10); }
  .slots div { background: #1a1528; border: 1px solid var(--line); border-radius: calc(var(--u)*6); padding: calc(var(--u)*6); text-align: center; font-size: .82em; }
  .slots div .e { font-size: calc(var(--u)*24); display: block; }

  table.rank { width: 100%; border-collapse: collapse; font-size: .92em; }
  table.rank th, table.rank td { padding: calc(var(--u)*6) calc(var(--u)*10); text-align: left; border-bottom: 1px solid rgba(255,255,255,.06); }
  table.rank th { color: var(--muted); font-weight: 600; position: sticky; top: 0; background: var(--panel2); }
  table.rank tr.me td { background: rgba(255,204,77,.15); color: var(--gold); font-weight: 700; }
  .medal { font-size: 1.1em; }

  /* 결과 / 사망 / 일시정지 */
  .result { width: calc(var(--u)*600); max-height: calc(var(--u)*520); overflow-y: auto; padding: calc(var(--u)*18) calc(var(--u)*22); text-align: center; }
  .result .menu { text-align: left; padding: 0; }
  .result .menu li { padding: calc(var(--u)*6) calc(var(--u)*14); }
  .grade { font-size: calc(var(--u)*72); font-weight: 900; line-height: 1; margin: calc(var(--u)*6) 0; background: linear-gradient(#fff6c2, #ffb400 60%, #b35c00); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 calc(var(--u)*4) 0 #3a1f00); animation: pop .5s ease-out; }
  @keyframes pop { 0% { transform: scale(2.4); opacity: 0; } 70% { transform: scale(.9); opacity: 1; } 100% { transform: scale(1); } }
  .kv { display: grid; grid-template-columns: 1fr auto 1fr auto; gap: calc(var(--u)*4) calc(var(--u)*20); text-align: left; margin: calc(var(--u)*10) 0; }
  .kv span:nth-child(even) { text-align: right; font-weight: 700; }
  .detail .kv { grid-template-columns: 1fr auto; }
  .drops { display: flex; flex-wrap: wrap; justify-content: center; gap: calc(var(--u)*6); min-height: calc(var(--u)*30); }
  .drops span { background: #1a1528; border-radius: calc(var(--u)*6); padding: calc(var(--u)*3) calc(var(--u)*8); font-size: .9em; }
  .dim { position: absolute; inset: 0; background: rgba(0,0,0,.55); }

  #modal { position: absolute; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; z-index: 20; }
  #modal .panel { padding: calc(var(--u)*22); width: calc(var(--u)*420); text-align: center; }
  #toast { position: absolute; left: 50%; top: calc(var(--u)*92); transform: translateX(-50%); z-index: 30; display: flex; flex-direction: column; gap: calc(var(--u)*6); align-items: center; pointer-events: none; }
  #toast div { background: rgba(20,17,30,.95); border: 1px solid var(--line); padding: calc(var(--u)*8) calc(var(--u)*16); border-radius: 99px; font-size: .92em; animation: fadein .2s; }
  @keyframes fadein { from { opacity: 0; transform: translateY(calc(var(--u)*-6)); } }
  #focusHint { position: absolute; bottom: calc(var(--u)*40); left: 50%; transform: translateX(-50%); background: #ffcc4d; color: #2b1a00; font-weight: 700; padding: calc(var(--u)*8) calc(var(--u)*16); border-radius: 99px; z-index: 40; pointer-events: none; }
  .keys-help { display: grid; grid-template-columns: auto 1fr; gap: calc(var(--u)*6) calc(var(--u)*14); align-items: center; text-align: left; }
  .loading { font-size: calc(var(--u)*20); color: var(--muted); }
</style>
